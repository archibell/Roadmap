<!doctype html>
<html>
  <body>
    <h1>Task Demo</h1>

    <p id="message">No task selected</p>

    <form id="task-form">
      <input id="task-input" placeholder="Type a task" />
      <button>Add task</button>
    </form>

    <ul id="task-list"></ul>

    <button id="load-task">Load task from API</button>

    <script>
      const message = document.querySelector("#message");
      const form = document.querySelector("#task-form");
      const input = document.querySelector("#task-input");
      const list = document.querySelector("#task-list");
      const loadButton = document.querySelector("#load-task");

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        if (input.value === "") {
          return;
        }

        const item = document.createElement("li");
        item.textContent = input.value;
        list.append(item);

        message.textContent = "Task added";
        input.value = "";
      });

      loadButton.addEventListener("click", async () => {
        try {
          message.textContent = "Loading...";

          const response = await fetch(
            "https://jsonplaceholder.typicode.com/todos/1"
          );
          const todo = await response.json();

          message.textContent = todo.title;
        } catch (error) {
          message.textContent = "Could not load the task";
          console.log(error.message);
        }
      });
    </script>
  </body>
</html>
